version: '3.8'

services:
  pipevideo-religieux:
    build:
      context: .
      dockerfile: Dockerfile
    # Nom distinct de l'instance de production (`pipevideo`) : les deux tournent
    # côte à côte sur la même machine. C'est ce nom que Caddy cible.
    container_name: pipevideo-religieux
    restart: always
    env_file:
      - .env
    volumes:
      # Médias générés (scene_*.png/mp4/mp3). Sans ce volume, chaque
      # redéploiement relancerait la génération GPU — donc des dollars.
      - pipevideo_religieux_public:/app/public
      # Clé SSH pour piloter le pod RunPod (kill switch, rclone vers R2).
      # Le chemin dans le conteneur doit correspondre à RUNPOD_SSH_KEY_PATH.
      - ${HOME}/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${HOME}/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
    networks:
      - epitnet_internal
    # Un rendu peut occuper le conteneur 30 min ; sans plafond, une fuite
    # mémoire de ffmpeg peut emporter les autres services de la machine.
    mem_limit: 4g

volumes:
  pipevideo_religieux_public:

networks:
  epitnet_internal:
    external: true
    name: epitnet_internal
