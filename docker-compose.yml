version: '3.8'

services:
  pipevideo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pipevideo
    restart: always
    env_file:
      - .env
    volumes:
      - pipevideo_public:/app/public
    networks:
      - epitnet_internal

volumes:
  pipevideo_public:

networks:
  epitnet_internal:
    external: true
    name: epitnet_internal
